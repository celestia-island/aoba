name: Checks

# One in-flight run per ref: a superseded push cancels its
# predecessor instead of queueing behind it (farm-pressure
# relief, AGENTS ci-ops 8.3.3).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
  workflow_call: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: [self-hosted, linux, x64, local]
    timeout-minutes: 300
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    # Read-only permission: this job performs checks only.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        rust: [stable, nightly]

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev socat libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          # macOS build runner provides many libs; install pkg-config and socat which are commonly needed in CI
          brew install pkg-config socat || true

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "Skipping Linux-only system deps on Windows; install additional required packages in other CI steps if necessary"

      # The use-group enforcement script needs nothing beyond a stock python3,
      # which every ubuntu image (hosted or the self-hosted Debian runners)
      # already ships. setup-python is deliberately gone: its "3.x" alias
      # resolution fails outright on the Debian 12 runners.
      - name: Enforce use statement groups
        id: enforce_use_groups
        if: startsWith(matrix.os, 'ubuntu') && matrix.rust == 'stable'
        run: |
          python3 scripts/enforce_use_groups.py
          if ! git diff --quiet; then
            echo "::error::Use statements are not grouped correctly. Run scripts/enforce_use_groups.py locally."
            git diff --name-only
            exit 1
          fi

      - name: Check formatting
        id: fmt_check
        # Formatting is anchored to the stable rustfmt: nightly rustfmt is a
        # moving style target and periodically reformats code stable accepted
        # (currently the include_str!/concat!/env! chains), failing this leg
        # for reasons unrelated to what the nightly compiler should test.
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Check compilation
        id: check
        run: cargo check --all-targets --all-features

      - name: Clippy lints
        id: clippy_check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --lib

  check-official:
    name: Check
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}

    # Read-only permission: this job performs checks only.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        rust: [stable, nightly]

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Install system dependencies (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev socat libssl-dev

      - name: Install system dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          # macOS build runner provides many libs; install pkg-config and socat which are commonly needed in CI
          brew install pkg-config socat || true

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          echo "Skipping Linux-only system deps on Windows; install additional required packages in other CI steps if necessary"

      - name: Cache cargo registry
        uses: actions/cache@v6
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ matrix.os }}-${{ matrix.rust }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.rust }}-cargo-
            ${{ matrix.os }}-cargo-

      # The use-group enforcement script needs nothing beyond a stock python3,
      # which every ubuntu image (hosted or the self-hosted Debian runners)
      # already ships. setup-python is deliberately gone: its "3.x" alias
      # resolution fails outright on the Debian 12 runners.
      - name: Enforce use statement groups
        id: enforce_use_groups
        if: startsWith(matrix.os, 'ubuntu') && matrix.rust == 'stable'
        run: |
          python3 scripts/enforce_use_groups.py
          if ! git diff --quiet; then
            echo "::error::Use statements are not grouped correctly. Run scripts/enforce_use_groups.py locally."
            git diff --name-only
            exit 1
          fi

      - name: Check formatting
        id: fmt_check
        # Formatting is anchored to the stable rustfmt: nightly rustfmt is a
        # moving style target and periodically reformats code stable accepted
        # (currently the include_str!/concat!/env! chains), failing this leg
        # for reasons unrelated to what the nightly compiler should test.
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Check compilation
        id: check
        run: cargo check --all-targets --all-features

      - name: Clippy lints
        id: clippy_check
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --lib
